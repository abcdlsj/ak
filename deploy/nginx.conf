# nginx in front of ak; certificates are yours (certbot or otherwise).
server {
    listen 443 ssl;
    http2 on;
    server_name ak.example.com;
    ssl_certificate     /etc/letsencrypt/live/ak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ak.example.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Streams must reach the agent as they come.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }
}
