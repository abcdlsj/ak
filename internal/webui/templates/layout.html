<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK · {{title .Page}}</title>
<link rel="icon" type="image/svg+xml" href="/ui/static/icon.svg">
<link rel="stylesheet" href="/ui/static/water.css">
<link rel="stylesheet" href="/ui/static/style.css">
<script src="/ui/static/app.js" defer></script>
</head>
<body>
{{if .Signed}}<header class="top">
  <a class="brand" href="/ui/accounts" aria-label="AK"><img class="logo" src="/ui/static/icon.svg" alt="" width="21" height="21"></a>
  <nav>
    <a href="/ui/accounts"{{if eq .Page "accounts" "device"}} class="on"{{end}}>Accounts</a>
    <a href="/ui/routes"{{if eq .Page "routes"}} class="on"{{end}}>Routes</a>
    <a href="/ui/tokens"{{if eq .Page "tokens"}} class="on"{{end}}>Tokens</a>
    <a href="/ui/usage"{{if eq .Page "usage"}} class="on"{{end}}>Usage</a>
  </nav>
  <form method="post" action="/ui/logout" class="logout">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button class="link">Log out</button>
  </form>
</header>{{end}}
<main>
{{with .Flash}}<p class="flash">{{.}}</p>{{end}}
{{template "content" .}}
</main>
<footer class="foot">
  <span>serve by AK</span>
  <span class="dim">·</span>
  <span class="mono">{{.Version}}</span>
  <span class="dim">·</span>
  <a href="https://github.com/abcdlsj/ak" target="_blank" rel="noopener noreferrer">github.com/abcdlsj/ak</a>
</footer>
</body>
</html>
