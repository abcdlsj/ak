{{define "content"}}
<section class="gate">
  <h1>Log in</h1>
  <p class="lede">The admin password opens the service's pages, nothing else.</p>
  {{with .Error}}<p class="flash bad">{{.}}</p>{{end}}
  {{if .CSRF}}
  <form method="post" action="/ui/login" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Admin password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button>Log in</button>
  </form>
  {{end}}
</section>
{{end}}
