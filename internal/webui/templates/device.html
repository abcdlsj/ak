{{define "content"}}
<section class="gate">
  <h1>Sign in {{.Account}}</h1>
  {{if .Err}}<p class="flash bad">{{.}}</p>
  {{else if .Done}}<p>Signed in. <a href="/ui/accounts">Back to accounts</a></p>
  {{else}}
  <p>Open <a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.URL}}</a> and approve{{with .Code}} the code <code class="select">{{.}}</code>{{end}}.</p>
  <p class="note" id="device-status" data-id="{{.ID}}">Waiting for the approval…</p>
  {{end}}
</section>
{{end}}
