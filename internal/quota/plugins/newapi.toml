# New API (and One API forks): GET /api/user/self ->
# {"success":true,"data":{"quota":…,"used_quota":…,"group":"…"}}
# 500000 quota units are one US dollar. The endpoint wants a system access
# token and the user id rather than an API key: set AK_QUOTA_TOKEN and
# AK_QUOTA_USER in the provider's env. Relays have arbitrary hosts, so this is
# never auto-detected; name it with quota = "newapi".
id = "newapi"
kind = "balance"
detail = "{{data.group}}"
ok = { path = "success", equals = true, message = "message" }

[request]
url = "{{root}}/api/user/self"
headers = { Authorization = "Bearer {{env.AK_QUOTA_TOKEN|key}}", New-Api-User = "{{env.AK_QUOTA_USER}}" }

[balance]
value = "data.quota"
used = "data.used_quota"
currency = "USD"
scale = 500000
